<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Emergency Contacts - RakshanBala</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #b00020;
        }

        .contact {
            padding: 15px;
            margin: 12px 0;
            background: #f5f5f5;
            border-radius: 10px;
            border-left: 5px solid #b00020;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
        }

        .phone {
            margin-top: 6px;
            color: #555;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            padding: 12px;
            background: #1565c0;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🛡️ RakshanBala</h1>
    <h2>👤 Saved Emergency Contacts</h2>

    {% if contacts %}
        {% for contact in contacts %}
            <div class="contact">
                <div class="name">👤 {{ contact[1] }}</div>
                <div class="phone">📞 {{ contact[2] }}</div>
            </div>
        {% endfor %}
    {% else %}
        <div class="empty">
            No emergency contacts saved yet.
        </div>
    {% endif %}

    <a href="/" class="back">⬅️ Back to RakshanBala</a>
</div>

</body>
</html>
