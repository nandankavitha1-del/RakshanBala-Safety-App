```
<div class="card">
    <h1>🛡️ RakshanBala</h1>
    <h2>📍 Live Location Viewer</h2>

    <div id="status">
        ⏳ Loading live location...
    </div>

    <a id="mapLink"
       class="map-button"
       href="#"
       target="_blank"
       style="display:none;">
        🗺️ OPEN IN GOOGLE MAPS
    </a>
</div>

<script>
    async function loadLiveLocation() {
        const status = document.getElementById("status");
        const mapLink = document.getElementById("mapLink");

        try {
            const response = await fetch("/get_live_location");
            const data = await response.json();

            if (data.success) {
                const lat = data.latitude;
                const lng = data.longitude;

                status.innerHTML =
                    "🟢 Live Location Available<br><br>" +
                    "Latitude: " + lat + "<br>" +
                    "Longitude: " + lng;

                mapLink.href =
                    "https://www.google.com/maps?q=" + lat + "," + lng;

                mapLink.style.display = "inline-block";

            } else {
                status.innerHTML =
                    "⏳ Location is not available yet.";

                mapLink.style.display = "none";
            }

        } catch (error) {
            console.error(error);

            status.innerHTML =
                "❌ Unable to connect to server.";

            mapLink.style.display = "none";
        }
    }

    loadLiveLocation();

    // Refresh location every 5 seconds
    setInterval(loadLiveLocation, 5000);
</script>
```
