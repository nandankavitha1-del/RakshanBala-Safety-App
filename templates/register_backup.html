<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RakshanBala - Register</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .box {
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #b00020;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #b00020;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🛡️ RakshanBala</h1>

    <h2>Create Account</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/register">

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >

        <input
            type="tel"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <button type="submit">
            REGISTER
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="/login">Login</a>
    </div>

</div>

</body>
</html>
