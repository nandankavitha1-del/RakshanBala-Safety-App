<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RakshanBala - Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .box {
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            color: #b00020;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 16px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            border: none;
            background: #b00020;
            color: white;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🛡️ RakshanBala</h1>
    <h2>Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">

        <input
            type="tel"
            name="phone"
            placeholder="Enter phone number"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">LOGIN</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>
</html>
